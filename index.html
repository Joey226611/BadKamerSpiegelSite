<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=320">
<title>Joey Interface</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
    margin:0;
    padding:0;
    background:#0f0f0f;
    color:white;
    font-family:'Inter', sans-serif;
    overflow:hidden;
    user-select:none;
}

/* Smooth transitions */
.fade {
    transition: opacity 0.6s ease, transform 0.6s ease;
}

.hidden {
    opacity:0;
    pointer-events:none;
    transform:scale(0.98);
}

.visible {
    opacity:1;
    pointer-events:auto;
    transform:scale(1);
}

/* Lock Screen */
#lockScreen {
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:15px;
    background:#0f0f0f;
}

input {
    padding:8px;
    font-size:16px;
    width:120px;
    text-align:center;
    border-radius:6px;
    border:none;
}

button {
    padding:6px 12px;
    font-size:14px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

/* Main Menu */
#mainMenu, #chooseMenu {
    position:absolute;
    width:100%;
    height:100%;
}

#clock {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    font-size:42px;
    font-weight:600;
}

/* Choose Menu */
#clockSmall {
    position:absolute;
    top:10px;
    right:15px;
    font-size:18px;
    font-weight:600;
}

#greeting {
    position:absolute;
    top:10px;
    left:15px;
    font-size:16px;
}

#buttons {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    display:flex;
    gap:20px;
}

.iconBtn {
    width:70px;
    height:70px;
    cursor:pointer;
    transition:transform 0.3s ease, opacity 0.3s ease;
}

.iconBtn:hover {
    transform:scale(1.1);
}
</style>
</head>
<body>

<!-- LOCK -->
<div id="lockScreen">
    <h2>Enter Code</h2>
    <input type="password" id="codeInput" maxlength="4">
    <button onclick="checkCode()">→</button>
</div>

<!-- MAIN MENU -->
<div id="mainMenu" class="fade hidden">
    <div id="clock"></div>
</div>

<!-- CHOOSE MENU -->
<div id="chooseMenu" class="fade hidden">
    <div id="clockSmall"></div>
    <div id="greeting"></div>

    <div id="buttons">
        <img src="images/Icons/MusicMode.png" class="iconBtn" onclick="musicMode()">
        <img src="images/Icons/MirrorMode.png" class="iconBtn" onclick="mirrorMode()">
        <img src="images/Icons/HomeMenu.png" class="iconBtn" onclick="goToMainMenu()">
    </div>
</div>

<script>
let currentMenu = "lock";
let chooseMenuTimer = null;
let mirrorTimer = null;

const CHOOSE_TIMEOUT = 60000;      // 1 minuut
const MIRROR_TIMEOUT = 3600000;    // 1 uur

// CLOCK
function updateClock(){
    const now = new Date();
    const time = now.toLocaleTimeString('nl-NL', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    document.getElementById("clock").innerText = time;
    document.getElementById("clockSmall").innerText = time;
}
setInterval(updateClock,1000);

// GREETING
function updateGreeting(){
    const hour = new Date().getHours();
    let greet = "Goedenavond";

    if(hour >= 6 && hour < 12) greet = "Goedemorgen";
    else if(hour >= 12 && hour < 18) greet = "Goedemiddag";
    else if(hour >= 18 && hour < 23) greet = "Goedenavond";
    else greet = "Goedenacht";

    document.getElementById("greeting").innerText = greet;
}

// LOCK
function checkCode(){
    const input = document.getElementById("codeInput").value;
    if(input === "8008"){
        localStorage.setItem("accessGranted","true");
        startMainMenu();
    }
}

// START
function startMainMenu(){
    document.getElementById("lockScreen").style.display="none";
    goToMainMenu();
}

// MAIN MENU
function goToMainMenu(){
    clearTimeout(chooseMenuTimer);
    clearTimeout(mirrorTimer);

    currentMenu = "main";
    document.getElementById("chooseMenu").classList.add("hidden");
    document.getElementById("mainMenu").classList.remove("hidden");
    document.getElementById("mainMenu").classList.add("visible");
}

// CHOOSE MENU
function goToChooseMenu(){
    if(currentMenu !== "main") return;

    currentMenu = "choose";

    document.getElementById("mainMenu").classList.add("hidden");
    document.getElementById("chooseMenu").classList.remove("hidden");
    document.getElementById("chooseMenu").classList.add("visible");

    updateGreeting();
    startChooseTimer();
}

// CHOOSE TIMER
function startChooseTimer(){
    clearTimeout(chooseMenuTimer);
    chooseMenuTimer = setTimeout(()=>{
        if(currentMenu === "choose"){
            goToMainMenu();
        }
    }, CHOOSE_TIMEOUT);
}

function resetChooseTimer(){
    if(currentMenu === "choose"){
        startChooseTimer();
    }
}

// MIRROR MODE
function mirrorMode(){
    if(currentMenu !== "choose") return;

    currentMenu = "mirror";
    document.getElementById("chooseMenu").classList.add("hidden");

    mirrorTimer = setTimeout(()=>{
        goToMainMenu();
    }, MIRROR_TIMEOUT);
}

function musicMode(){
    if(currentMenu !== "choose") return;
    alert("Music Mode komt later 🎵");
}

// GLOBAL CLICK
document.addEventListener("click",(e)=>{
    if(currentMenu === "main"){
        goToChooseMenu();
    }
    else if(currentMenu === "choose"){
        resetChooseTimer();
    }
    else if(currentMenu === "mirror"){
        goToChooseMenu();
    }
});

// AUTO LOGIN CHECK
window.onload = ()=>{
    updateClock();
    if(localStorage.getItem("accessGranted") === "true"){
        startMainMenu();
    }
};
</script>

</body>
</html>

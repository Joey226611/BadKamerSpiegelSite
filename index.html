<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Main Interface</title>

<style>
body{
    margin:0;
    background:black;
    color:white;
    font-family:Arial, sans-serif;
    overflow:hidden;
}

/* Lock screen */
#lockScreen{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:15px;
}

/* Main Menu */
#mainMenu{
    display:none;
    width:100%;
    height:100%;
    position:absolute;
}

#clock{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:60px;
}

/* Choose Menu */
#chooseMenu{
    display:none;
    width:100%;
    height:100%;
    position:absolute;
}

#clockSmall{
    position:absolute;
    top:10px;
    right:20px;
    font-size:20px;
}

#greeting{
    position:absolute;
    top:10px;
    left:20px;
    font-size:20px;
}

#buttons{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    display:flex;
    gap:30px;
}

.iconBtn{
    width:90px;
    cursor:pointer;
}
</style>
</head>
<body>

<!-- LOCK -->
<div id="lockScreen">
    <h2>Voer code in</h2>
    <input type="password" id="codeInput" maxlength="4">
    <button onclick="checkCode()">Enter</button>
</div>

<!-- MAIN MENU -->
<div id="mainMenu">
    <div id="clock"></div>
</div>

<!-- CHOOSE MENU -->
<div id="chooseMenu">
    <div id="clockSmall"></div>
    <div id="greeting"></div>

    <div id="buttons">
        <img src="images/Icons/MusicMode.png" class="iconBtn" onclick="musicMode()">
        <img src="images/Icons/MirrorMode.png" class="iconBtn" onclick="mirrorMode()">
        <img src="images/Icons/HomeMenu.png" class="iconBtn" onclick="goToMainMenu()">
    </div>
</div>

<script>
const correctCode = "8008";

const lockScreen = document.getElementById("lockScreen");
const mirrorScreen = document.getElementById("mirrorScreen");
const codeInput = document.getElementById("codeInput");
const enterBtn = document.getElementById("enterBtn");

const clock = document.getElementById("clock");
const greeting = document.getElementById("greeting");
const chooseMenu = document.getElementById("chooseMenu");

const musicBtn = document.getElementById("musicBtn");
const mirrorBtn = document.getElementById("mirrorBtn");
const homeBtn = document.getElementById("homeBtn");

let mirrorMode = false;
let mirrorTimer = null;
let chooseTimer = null;

const CHOOSE_TIMEOUT = 60000;      // 1 minuut
const MIRROR_TIMEOUT = 3600000;    // 1 uur


/* ===================== UNLOCK ===================== */

if(localStorage.getItem("accessGranted")==="true"){
    lockScreen.style.display="none";
    mirrorScreen.style.display="block";
    startClock();
}

function unlock(){
    if(codeInput.value===correctCode){
        localStorage.setItem("accessGranted","true");
        lockScreen.style.display="none";
        mirrorScreen.style.display="block";
        startClock();
    }
}

enterBtn.onclick=unlock;
codeInput.addEventListener("keydown",e=>{
    if(e.key==="Enter") unlock();
});


/* ===================== CLOCK + GREETING ===================== */

function updateGreeting(){
    const h=new Date().getHours();
    let t;

    if(h>=5&&h<12)t="Goedemorgen";
    else if(h>=12&&h<18)t="Goedemiddag";
    else if(h>=18&&h<22)t="Goedenavond";
    else t="Goedenacht";

    greeting.textContent=t+", Gebruiker";
}

function startClock(){
    function update(){
        const n=new Date();
        clock.textContent=
            String(n.getHours()).padStart(2,'0')+":"+
            String(n.getMinutes()).padStart(2,'0')+":"+
            String(n.getSeconds()).padStart(2,'0');
        updateGreeting();
    }
    update();
    setInterval(update,1000);
}


/* ===================== CHOOSE TIMER ===================== */

function startChooseTimer(){
    clearTimeout(chooseTimer);

    chooseTimer=setTimeout(()=>{
        if(chooseMenu.classList.contains("active")){
            closeChooseMenu();
        }
    },CHOOSE_TIMEOUT);
}

function resetChooseTimer(){
    if(chooseMenu.classList.contains("active")){
        startChooseTimer();
    }
}


/* ===================== MENU CONTROL ===================== */

function openChooseMenu(){
    clock.classList.add("topright");
    greeting.classList.add("show");
    chooseMenu.classList.add("active");
    startChooseTimer();
}

function closeChooseMenu(){
    chooseMenu.classList.remove("active");
    greeting.classList.remove("show");
    clock.classList.remove("topright");
    clearTimeout(chooseTimer);
}


/* ===================== SCREEN CLICK ===================== */

mirrorScreen.addEventListener("click",e=>{

    // Als mirrorMode actief → terug naar choose
    if(mirrorMode){
        mirrorMode=false;
        chooseMenu.classList.add("active");
        greeting.classList.add("show");
        startChooseTimer();
        return;
    }

    // Als chooseMenu nog niet open → open hem
    if(!chooseMenu.classList.contains("active")){
        openChooseMenu();
    }else{
        // Als al open → reset timer
        resetChooseTimer();
    }
});


/* ===================== BUTTONS ===================== */

mirrorBtn.onclick=function(e){
    if(!chooseMenu.classList.contains("active")) return;
    e.stopPropagation();

    mirrorMode=true;
    chooseMenu.classList.remove("active");
    greeting.classList.remove("show");
    clearTimeout(chooseTimer);

    mirrorTimer=setTimeout(()=>{
        mirrorMode=false;
        closeChooseMenu();
    },MIRROR_TIMEOUT);
};

homeBtn.onclick=function(e){
    if(!chooseMenu.classList.contains("active")) return;
    e.stopPropagation();

    closeChooseMenu();
};

musicBtn.onclick=function(e){
    if(!chooseMenu.classList.contains("active")) return;
    e.stopPropagation();

    alert("Music Mode komt later 😎");
};
</script>
</body>
</html>

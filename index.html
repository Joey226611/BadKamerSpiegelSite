<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Main Interface</title>

<style>
body{
    margin:0;
    background:black;
    color:white;
    font-family:Arial, sans-serif;
    overflow:hidden;
}

/* Lock screen */
#lockScreen{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:15px;
}

/* Main Menu */
#mainMenu{
    display:none;
    width:100%;
    height:100%;
    position:absolute;
}

#clock{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:60px;
}

/* Choose Menu */
#chooseMenu{
    display:none;
    width:100%;
    height:100%;
    position:absolute;
}

#clockSmall{
    position:absolute;
    top:10px;
    right:20px;
    font-size:20px;
}

#greeting{
    position:absolute;
    top:10px;
    left:20px;
    font-size:20px;
}

#buttons{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    display:flex;
    gap:30px;
}

.iconBtn{
    width:90px;
    cursor:pointer;
}
</style>
</head>
<body>

<!-- LOCK -->
<div id="lockScreen">
    <h2>Voer code in</h2>
    <input type="password" id="codeInput" maxlength="4">
    <button onclick="checkCode()">Enter</button>
</div>

<!-- MAIN MENU -->
<div id="mainMenu">
    <div id="clock"></div>
</div>

<!-- CHOOSE MENU -->
<div id="chooseMenu">
    <div id="clockSmall"></div>
    <div id="greeting"></div>

    <div id="buttons">
        <img src="images/Icons/MusicMode.png" class="iconBtn" onclick="musicMode()">
        <img src="images/Icons/MirrorMode.png" class="iconBtn" onclick="mirrorMode()">
        <img src="images/Icons/HomeMenu.png" class="iconBtn" onclick="goToMainMenu()">
    </div>
</div>

<script>

let currentMenu = "lock";
let chooseTimer = null;
let mirrorTimer = null;

const CHOOSE_TIMEOUT = 60000;      // 1 minuut
const MIRROR_TIMEOUT = 3600000;    // 1 uur

// CLOCK
function updateClock(){
    const now = new Date();
    const time = now.toLocaleTimeString("nl-NL", {
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit"
    });

    document.getElementById("clock").innerText = time;
    document.getElementById("clockSmall").innerText = time;
}
setInterval(updateClock,1000);

// GREETING
function updateGreeting(){
    const hour = new Date().getHours();
    let text = "Goedenavond";

    if(hour >= 6 && hour < 12) text = "Goedemorgen";
    else if(hour >= 12 && hour < 18) text = "Goedemiddag";
    else if(hour >= 18 && hour < 23) text = "Goedenavond";
    else text = "Goedenacht";

    document.getElementById("greeting").innerText = text;
}

// CODE CHECK
function checkCode(){
    if(document.getElementById("codeInput").value === "8008"){
        localStorage.setItem("access","true");
        startMainMenu();
    }
}

// START
function startMainMenu(){
    document.getElementById("lockScreen").style.display = "none";
    goToMainMenu();
}

// MAIN MENU
function goToMainMenu(){
    clearTimeout(chooseTimer);
    clearTimeout(mirrorTimer);

    currentMenu = "main";

    document.getElementById("chooseMenu").style.display = "none";
    document.getElementById("mainMenu").style.display = "block";
}

// CHOOSE MENU
function goToChooseMenu(){
    if(currentMenu !== "main") return;

    currentMenu = "choose";

    document.getElementById("mainMenu").style.display = "none";
    document.getElementById("chooseMenu").style.display = "block";

    updateGreeting();
    startChooseTimer();
}

// CHOOSE TIMER
function startChooseTimer(){
    clearTimeout(chooseTimer);
    chooseTimer = setTimeout(function(){
        if(currentMenu === "choose"){
            goToMainMenu();
        }
    }, CHOOSE_TIMEOUT);
}

// MIRROR MODE
function mirrorMode(){
    if(currentMenu !== "choose") return;

    currentMenu = "mirror";
    document.getElementById("chooseMenu").style.display = "none";

    mirrorTimer = setTimeout(function(){
        goToMainMenu();
    }, MIRROR_TIMEOUT);
}

// MUSIC MODE
function musicMode(){
    if(currentMenu !== "choose") return;
    alert("Music Mode komt later");
}

// CLICK LOGIC

// MainMenu klik → ChooseMenu
document.getElementById("mainMenu").addEventListener("click", function(){
    if(currentMenu === "main"){
        goToChooseMenu();
    }
});

// ChooseMenu klik → reset timer
document.getElementById("chooseMenu").addEventListener("click", function(){
    if(currentMenu === "choose"){
        startChooseTimer();
    }
});

// Mirror klik → terug naar Choose
document.addEventListener("click", function(){
    if(currentMenu === "mirror"){
        goToChooseMenu();
    }
});

// Auto login check
window.onload = function(){
    updateClock();
    if(localStorage.getItem("access") === "true"){
        startMainMenu();
    }
};

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Mirror</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;400;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Poppins', sans-serif;
    background: #0d0d0d;
    color: white;
    overflow: hidden;
}

/* Lockscreen */
#lockScreen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
}

input, button {
    padding: 15px 20px;
    font-size: 20px;
    border-radius: 8px;
    border: none;
    outline: none;
}

input {
    background: #1a1a1a;
    color: white;
    margin-bottom: 10px;
    text-align: center;
}

button {
    background: #88cfff;
    cursor: pointer;
}

/* Mirror */
.mirror {
    width: 100vw;
    height: 100vh;
    display: none;
    position: relative;
    overflow: hidden;
}

.glass {
    position: absolute;
    width: 100%;
    height: 100%;
    backdrop-filter: blur(12px);
    background: rgba(255,255,255,0.02);
    pointer-events: none;
}

/* Clock */
.clock {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 90px;
    font-weight: 200;
    transition: all 0.7s cubic-bezier(.4,0,.2,1);
}

.clock.topright {
    top: 25px;
    right: 25px;
    left: auto;
    transform: translate(0,0);
    font-size: 50px;
}

/* Greeting */
#greeting {
    position: absolute;
    top: 25px;
    left: 25px;
    font-size: 24px;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.6s ease;
}

#greeting.show {
    opacity: 1;
}

/* ChooseMenu */
#chooseMenu {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -40%) scale(0.95);
    display: flex;
    gap: 50px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.6s cubic-bezier(.4,0,.2,1);
}

#chooseMenu.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
    pointer-events: auto;
}

.chooseBtn {
    width: 120px;
    height: 120px;
    cursor: pointer;
    transition: transform 0.25s ease;
}

.chooseBtn:hover {
    transform: scale(1.1);
}

/* Fade overlay effect */
.fadeOut {
    animation: fadeOut 0.6s forwards;
}

@keyframes fadeOut {
    to { opacity: 0; }
}
</style>
</head>
<body>

<div id="lockScreen">
    <input type="password" id="codeInput" placeholder="Enter code">
    <button id="enterBtn">→</button>
</div>

<div class="mirror" id="mirrorScreen">
    <div class="glass"></div>
    <div class="clock" id="clock"></div>
    <div id="greeting"></div>

    <div id="chooseMenu">
        <img src="images/Icons/MusicMode.png" class="chooseBtn" id="musicBtn">
        <img src="images/Icons/MirrorMode.png" class="chooseBtn" id="mirrorBtn">
        <img src="images/Icons/HomeMenu.png" class="chooseBtn" id="homeBtn">
    </div>
</div>

<script>
const correctCode = "8008";

const lockScreen = document.getElementById("lockScreen");
const mirrorScreen = document.getElementById("mirrorScreen");
const codeInput = document.getElementById("codeInput");
const enterBtn = document.getElementById("enterBtn");

const clock = document.getElementById("clock");
const greeting = document.getElementById("greeting");
const chooseMenu = document.getElementById("chooseMenu");

let mirrorMode = false;
let mirrorTimer = null;

/* Unlock */
if(localStorage.getItem("accessGranted")==="true"){
    lockScreen.style.display="none";
    mirrorScreen.style.display="block";
    startClock();
}

function unlock(){
    if(codeInput.value===correctCode){
        localStorage.setItem("accessGranted","true");
        lockScreen.style.display="none";
        mirrorScreen.style.display="block";
        startClock();
    }
}
enterBtn.onclick=unlock;
codeInput.addEventListener("keydown",e=>{
    if(e.key==="Enter") unlock();
});

/* Clock + Greeting */
function updateGreeting(){
    const h=new Date().getHours();
    let t;
    if(h>=5&&h<12)t="Goedemorgen";
    else if(h>=12&&h<18)t="Goedemiddag";
    else if(h>=18&&h<22)t="Goedenavond";
    else t="Goedenacht";
    greeting.textContent=t+", Gebruiker";
}

function startClock(){
    function update(){
        const n=new Date();
        clock.textContent=
            String(n.getHours()).padStart(2,'0')+":"+
            String(n.getMinutes()).padStart(2,'0')+":"+
            String(n.getSeconds()).padStart(2,'0');
        updateGreeting();
    }
    update();
    setInterval(update,1000);
}

/* Screen Click */
mirrorScreen.addEventListener("click",e=>{

    if(mirrorMode){
        mirrorMode=false;
        chooseMenu.classList.add("active");
        greeting.classList.add("show");
        return;
    }

    if(!chooseMenu.classList.contains("active")){
        clock.classList.add("topright");
        greeting.classList.add("show");
        chooseMenu.classList.add("active");
    }
});

/* Buttons */
document.getElementById("mirrorBtn").onclick=function(e){
    if(!chooseMenu.classList.contains("active")) return;
    e.stopPropagation();

    mirrorMode=true;
    chooseMenu.classList.remove("active");
    greeting.classList.remove("show");

    mirrorTimer=setTimeout(()=>{
        mirrorMode=false;
        chooseMenu.classList.add("active");
        greeting.classList.add("show");
    },3600000);
};

document.getElementById("homeBtn").onclick=function(e){
    if(!chooseMenu.classList.contains("active")) return;
    e.stopPropagation();

    chooseMenu.classList.remove("active");
    greeting.classList.remove("show");
    clock.classList.remove("topright");
};

document.getElementById("musicBtn").onclick=function(e){
    if(!chooseMenu.classList.contains("active")) return;
    e.stopPropagation();
    alert("Music Mode komt later 😎");
};
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Mirror</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;400;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Poppins', Arial, sans-serif;
    background: #0d0d0d;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

input, button {
    padding: 15px 20px;
    font-size: 20px;
    border: none;
    border-radius: 8px;
    outline: none;
}

input {
    margin-right: 10px;
    width: 200px;
    text-align: center;
    background: #1a1a1a;
    color: white;
}

button {
    background: #88cfff;
    color: #0d0d0d;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.3s;
}

button:hover {
    background: #44aaff;
}

/* Mirror / main menu */
.mirror {
    width: 100vw;
    height: 100vh;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
}

.glass {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255,255,255,0.02);
    backdrop-filter: blur(12px);
    pointer-events: none;
    z-index: 0;
}

.clock {
    font-size: 90px;
    font-weight: 200;
    color: white;
    text-shadow: 0 0 20px rgba(255,255,255,0.2);
    z-index: 1;
}

.nightmode .clock {
    color: #88cfff;
}
</style>
</head>
<body>

<!-- Lock screen -->
<div id="lockScreen">
    <input type="password" id="codeInput" placeholder="Enter code">
    <button id="enterBtn">→</button>
</div>

<!-- Main mirror menu -->
<div class="mirror" id="mirrorScreen">
    <div class="glass"></div>
    <div class="clock" id="clock"></div>
</div>

<script>
const correctCode = '8008';
const lockScreen = document.getElementById('lockScreen');
const mirrorScreen = document.getElementById('mirrorScreen');
const codeInput = document.getElementById('codeInput');
const enterBtn = document.getElementById('enterBtn');

// Check localStorage bij laden
if(localStorage.getItem('accessGranted') === 'true') {
    lockScreen.style.display = 'none';
    mirrorScreen.style.display = 'flex';
    startClock();
}

// Functie om main menu te tonen
function unlock() {
    if(codeInput.value === correctCode) {
        localStorage.setItem('accessGranted', 'true');
        lockScreen.style.display = 'none';
        mirrorScreen.style.display = 'flex';
        startClock();
    } else {
        alert("Verkeerde code!");
        codeInput.value = '';
    }
}

enterBtn.addEventListener('click', unlock);
codeInput.addEventListener('keydown', e => {
    if(e.key === 'Enter') unlock();
});

// Clock functie
function startClock() {
    const clock = document.getElementById('clock');
    function updateClock() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2,"0");
        const minutes = String(now.getMinutes()).padStart(2,"0");
        const seconds = String(now.getSeconds()).padStart(2,"0");
        clock.textContent = hours + ":" + minutes + ":" + seconds;

        // Nachtmodus check
        if(now.getHours() >= 22 || now.getHours() < 5) {
            document.body.classList.add('nightmode');
        } else {
            document.body.classList.remove('nightmode');
        }
    }
    updateClock();
    setInterval(updateClock, 1000);
}
</script>

</body>
</html>

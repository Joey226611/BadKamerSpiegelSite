<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Mirror</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;400;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Poppins', Arial, sans-serif;
    background: #0d0d0d;
    color: white;
    overflow: hidden;
}

/* Lockscreen */
#lockScreen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
}

input, button {
    padding: 15px 20px;
    font-size: 20px;
    border: none;
    border-radius: 8px;
    outline: none;
}

input {
    margin-bottom: 10px;
    width: 200px;
    text-align: center;
    background: #1a1a1a;
    color: white;
}

button {
    background: #88cfff;
    color: #0d0d0d;
    cursor: pointer;
    font-weight: 600;
}

#errorMsg {
    margin-top: 10px;
    color: #ff5555;
    display: none;
}

/* Mirror */
.mirror {
    width: 100vw;
    height: 100vh;
    display: none;
    position: relative;
}

.glass {
    position: absolute;
    width: 100%;
    height: 100%;
    background: rgba(255,255,255,0.02);
    backdrop-filter: blur(12px);
    pointer-events: none;
}

.clock {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 90px;
    font-weight: 200;
    transition: all 0.5s;
}

.clock.topright {
    top: 20px;
    right: 20px;
    left: auto;
    transform: none;
    font-size: 50px;
}

#greeting {
    position: absolute;
    top: 20px;
    left: 20px;
    font-size: 24px;
    font-weight: 600;
    display: none;
}

/* Choose Menu */
#chooseMenu {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: none;
    gap: 40px;
    opacity: 0;
    transition: opacity 0.6s ease;
}

#chooseMenu.active {
    display: flex;
    opacity: 1;
}

.chooseBtn {
    width: 120px;
    height: 120px;
    cursor: pointer;
    transition: transform 0.2s;
}

.chooseBtn:hover {
    transform: scale(1.1);
}
</style>
</head>
<body>

<!-- Lock -->
<div id="lockScreen">
    <input type="password" id="codeInput" placeholder="Enter code">
    <button id="enterBtn">→</button>
    <div id="errorMsg">Verkeerde code!</div>
</div>

<!-- Mirror -->
<div class="mirror" id="mirrorScreen">
    <div class="glass"></div>
    <div class="clock" id="clock"></div>
    <div id="greeting"></div>

    <div id="chooseMenu">
        <img src="images/Icons/MusicMode.png" class="chooseBtn" id="musicBtn">
        <img src="images/Icons/MirrorMode.png" class="chooseBtn" id="mirrorBtn">
        <img src="images/Icons/HomeMenu.png" class="chooseBtn" id="homeBtn">
    </div>
</div>

<script>
const correctCode = '8008';

const lockScreen = document.getElementById('lockScreen');
const mirrorScreen = document.getElementById('mirrorScreen');
const codeInput = document.getElementById('codeInput');
const enterBtn = document.getElementById('enterBtn');
const errorMsg = document.getElementById('errorMsg');

const clock = document.getElementById('clock');
const greeting = document.getElementById('greeting');
const chooseMenu = document.getElementById('chooseMenu');

let mirrorMode = false;
let mirrorTimer = null;

/* Unlock */
if(localStorage.getItem('accessGranted') === 'true'){
    lockScreen.style.display = 'none';
    mirrorScreen.style.display = 'block';
    startClock();
}

function unlock(){
    if(codeInput.value === correctCode){
        localStorage.setItem('accessGranted', 'true');
        lockScreen.style.display = 'none';
        mirrorScreen.style.display = 'block';
        startClock();
    } else {
        errorMsg.style.display = 'block';
        codeInput.value = '';
    }
}

enterBtn.onclick = unlock;
codeInput.addEventListener('keydown', e=>{
    if(e.key === 'Enter') unlock();
});

/* Clock */
function updateGreeting(){
    const hour = new Date().getHours();
    let text;

    if(hour >=5 && hour <12) text = "Goedemorgen";
    else if(hour >=12 && hour <18) text = "Goedemiddag";
    else if(hour >=18 && hour <22) text = "Goedenavond";
    else text = "Goedenacht";

    greeting.textContent = text + ", Gebruiker";
}

function startClock(){
    function update(){
        const now = new Date();
        clock.textContent =
            String(now.getHours()).padStart(2,'0') + ":" +
            String(now.getMinutes()).padStart(2,'0') + ":" +
            String(now.getSeconds()).padStart(2,'0');

        updateGreeting();
    }
    update();
    setInterval(update,1000);
}

/* Screen click logic */
mirrorScreen.addEventListener('click', e=>{

    // Mirror mode klik = terug naar choose
    if(mirrorMode){
        mirrorMode = false;
        chooseMenu.classList.add('active');
        greeting.style.display = 'block';
        return;
    }

    // Alleen openen als menu niet actief is
    if(!chooseMenu.classList.contains('active')){
        chooseMenu.classList.add('active');
        clock.classList.add('topright');
        greeting.style.display = 'block';
    }
});

/* Buttons werken alleen als menu actief is */
document.getElementById('mirrorBtn').onclick = function(e){
    if(!chooseMenu.classList.contains('active')) return;

    e.stopPropagation();
    mirrorMode = true;
    chooseMenu.classList.remove('active');
    greeting.style.display = 'none';

    mirrorTimer = setTimeout(()=>{
        mirrorMode = false;
        chooseMenu.classList.add('active');
        greeting.style.display = 'block';
    }, 3600000);
};

document.getElementById('homeBtn').onclick = function(e){
    if(!chooseMenu.classList.contains('active')) return;

    e.stopPropagation();
    chooseMenu.classList.remove('active');
    greeting.style.display = 'none';
    clock.classList.remove('topright');
};

document.getElementById('musicBtn').onclick = function(e){
    if(!chooseMenu.classList.contains('active')) return;

    e.stopPropagation();
    alert("Music Mode komt later 😉");
};
</script>

</body>
</html>

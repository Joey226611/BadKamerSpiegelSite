<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Mirror</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;400;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Poppins', Arial, sans-serif;
    background: #0d0d0d;
    color: white;
    overflow: hidden;
}

/* Lockscreen */
#lockScreen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
}

input, button {
    padding: 15px 20px;
    font-size: 20px;
    border: none;
    border-radius: 8px;
    outline: none;
}

input {
    margin-bottom: 10px;
    width: 200px;
    text-align: center;
    background: #1a1a1a;
    color: white;
}

button {
    background: #88cfff;
    color: #0d0d0d;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.3s;
}

button:hover {
    background: #44aaff;
}

#errorMsg {
    margin-top: 10px;
    color: #ff5555;
    font-weight: 500;
    display: none;
}

/* Main Menu */
.mirror {
    width: 100vw;
    height: 100vh;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    cursor: pointer;
}

.glass {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255,255,255,0.02);
    backdrop-filter: blur(12px);
    pointer-events: none;
    z-index: 0;
}

.clock {
    font-size: 90px;
    font-weight: 200;
    color: white;
    text-shadow: 0 0 20px rgba(255,255,255,0.2);
    z-index: 1;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    transition: all 0.5s;
}

/* Clock & greeting positions in ChooseMenu */
.clock.topright {
    top: 20px;
    right: 20px;
    left: auto;
    transform: none;
    font-size: 50px;
}

#greeting {
    position: absolute;
    top: 20px;
    left: 20px;
    font-size: 24px;
    font-weight: 600;
    display: none;
}

/* ChooseMenu */
#chooseMenu {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    gap: 40px;
    opacity: 0;
    transition: opacity 0.8s ease;
    z-index: 2;
}

#chooseMenu.show {
    opacity: 1;
}

/* Buttons as images */
.chooseBtn {
    width: 120px;
    height: 120px;
    cursor: pointer;
    transition: transform 0.2s;
}

.chooseBtn:hover {
    transform: scale(1.1);
}
</style>
</head>
<body>

<!-- Lock screen -->
<div id="lockScreen">
    <input type="password" id="codeInput" placeholder="Enter code">
    <button id="enterBtn">→</button>
    <div id="errorMsg">Verkeerde code!</div>
</div>

<!-- Main Mirror Menu -->
<div class="mirror" id="mirrorScreen">
    <div class="glass"></div>
    <div class="clock" id="clock"></div>
    <div id="greeting">Gebruiker</div>
    <div id="chooseMenu">
        <img src="images/Icons/MusicMode.png" class="chooseBtn" id="musicBtn">
        <img src="images/Icons/MirrorMode.png" class="chooseBtn" id="mirrorBtn">
        <img src="images/Icons/HomeMenu.png" class="chooseBtn" id="homeBtn">
    </div>
</div>

<script>
const correctCode = '8008';
const lockScreen = document.getElementById('lockScreen');
const mirrorScreen = document.getElementById('mirrorScreen');
const codeInput = document.getElementById('codeInput');
const enterBtn = document.getElementById('enterBtn');
const errorMsg = document.getElementById('errorMsg');

const clock = document.getElementById('clock');
const greeting = document.getElementById('greeting');
const chooseMenu = document.getElementById('chooseMenu');

let mirrorModeTimer;

// --- Lockscreen ---
if(localStorage.getItem('accessGranted') === 'true') {
    lockScreen.style.display = 'none';
    mirrorScreen.style.display = 'flex';
    startClock();
}

function unlock() {
    if(codeInput.value === correctCode) {
        localStorage.setItem('accessGranted', 'true');
        lockScreen.style.display = 'none';
        mirrorScreen.style.display = 'flex';
        startClock();
    } else {
        errorMsg.style.display = 'block';
        codeInput.value = '';
    }
}

enterBtn.addEventListener('click', unlock);
codeInput.addEventListener('keydown', e => {
    if(e.key === 'Enter') unlock();
});

// --- Clock ---
function startClock() {
    function updateClock() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2,"0");
        const minutes = String(now.getMinutes()).padStart(2,"0");
        const seconds = String(now.getSeconds()).padStart(2,"0");
        clock.textContent = hours + ":" + minutes + ":" + seconds;

        // Nachtmodus
        if(now.getHours() >= 22 || now.getHours() < 5) {
            document.body.classList.add('nightmode');
        } else {
            document.body.classList.remove('nightmode');
        }
    }
    updateClock();
    setInterval(updateClock, 1000);
}

// --- ChooseMenu ---
mirrorScreen.addEventListener('click', (e)=>{
    if(e.target.id === 'chooseMenu' || e.target.classList.contains('chooseBtn')) return; // Klik op menu zelf doet niks
    // Toon ChooseMenu
    chooseMenu.classList.add('show');
    clock.classList.add('topright');
    greeting.style.display = 'block';
});

// Buttons
document.getElementById('musicBtn').addEventListener('click', ()=>{
    alert("Music Mode placeholder"); // later functionaliteit
});
document.getElementById('mirrorBtn').addEventListener('click', ()=>{
    // Clear texts
    chooseMenu.classList.remove('show');
    greeting.style.display = 'none';
    // timer van 1 uur terug naar main menu
    mirrorModeTimer = setTimeout(()=>{
        chooseMenu.classList.add('show');
        greeting.style.display = 'block';
    }, 3600000); // 1 uur
});
document.getElementById('homeBtn').addEventListener('click', ()=>{
    chooseMenu.classList.remove('show');
    greeting.style.display = 'none';
    clock.classList.remove('topright');
});
</script>

</body>
</html>

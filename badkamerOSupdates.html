<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Mirror</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;400;600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Poppins;
background:#0d0d0d;
color:white;
overflow:hidden;
}

/* mirror base */
.mirror{
width:100vw;
height:100vh;
display:none;
position:relative;
}

.clock{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:90px;
font-weight:200;
transition:.6s;
}

.clock.topright{
top:25px;
right:25px;
left:auto;
transform:none;
font-size:50px;
}

#greeting{
position:absolute;
top:25px;
left:25px;
font-size:24px;
opacity:0;
transition:.5s;
}

#greeting.show{
opacity:1;
}

#chooseMenu{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
display:flex;
gap:50px;
opacity:0;
pointer-events:none;
transition:.6s;
}

#chooseMenu.active{
opacity:1;
pointer-events:auto;
}

.chooseBtn{
width:120px;
cursor:pointer;
transition:.2s;
}

.chooseBtn:hover{
transform:scale(1.1);
}

/* MUSIC UI */

#musicUI{
position:absolute;
width:100%;
height:100%;
background:#0b0b0b;
display:none;
flex-direction:column;
}

.musicHeader{
padding:30px;
font-size:28px;
font-weight:600;
}

.widgetGrid{
display:flex;
gap:40px;
padding:40px;
flex-wrap:wrap;
}

.widget{
width:200px;
cursor:pointer;
}

.widget img{
width:100%;
border-radius:10px;
}

.widgetTitle{
margin-top:10px;
font-size:18px;
}

/* playlist */

#playlistView{
display:none;
padding:40px;
}

.track{
display:flex;
align-items:center;
gap:20px;
margin-bottom:15px;
cursor:pointer;
}

.track img{
width:60px;
border-radius:6px;
}

/* player */

#player{
position:absolute;
bottom:0;
width:100%;
padding:20px;
background:#111;
display:flex;
align-items:center;
gap:20px;
}

.controls button{
font-size:18px;
}

.progress{
flex:1;
}

</style>
</head>

<body>

<div class="mirror" id="mirrorScreen">

<div class="clock" id="clock"></div>
<div id="greeting"></div>

<div id="chooseMenu">

<img src="images/Icons/MusicMode.png" class="chooseBtn" id="musicBtn">
<img src="images/Icons/MirrorMode.png" class="chooseBtn">
<img src="images/Icons/HomeMenu.png" class="chooseBtn" id="homeBtn">

</div>

<!-- MUSIC INTERFACE -->

<div id="musicUI">

<div class="musicHeader">
Music
<button onclick="closeMusic()">Back</button>
</div>

<div class="widgetGrid" id="playlistWidgets"></div>

<div id="playlistView"></div>

<div id="player">

<div id="playerInfo"></div>

<div class="controls">

<button onclick="prevSong()">⏮</button>
<button onclick="togglePlay()">⏯</button>
<button onclick="nextSong()">⏭</button>

<button onclick="toggleShuffle()">🔀</button>
<button onclick="toggleLoop()">🔁</button>

</div>

<input type="range" id="progress" class="progress">

</div>

</div>

</div>

<script>

/* CLOCK */

const clock=document.getElementById("clock");

function updateClock(){
const n=new Date();
clock.textContent=
String(n.getHours()).padStart(2,"0")+":"+
String(n.getMinutes()).padStart(2,"0")+":"+
String(n.getSeconds()).padStart(2,"0");
}

setInterval(updateClock,1000);
updateClock();

/* MUSIC DATA */

const playlists=[

{
title:"SummerHits2026",
image:"images/MusicPlayerThumbnails/summer.png",
tracks:[

{
title:"Sunset Drive",
artist:"DJ Wave",
file:"Music/summer1.mp3",
thumbnail:"images/MusicThumbnails/summer1.png"
},

{
title:"Beach Party",
artist:"Ocean Beats",
file:"Music/summer2.mp3",
thumbnail:"images/MusicThumbnails/summer2.png"
}

]

},

{
title:"Chill Vibes",
image:"images/MusicPlayerThumbnails/chill.png",
tracks:[

{
title:"Night Air",
artist:"LoFi Sky",
file:"Music/chill1.mp3",
thumbnail:"images/MusicThumbnails/chill1.png"
}

]

}

];

/* BUILD WIDGETS */

const widgetContainer=document.getElementById("playlistWidgets");

playlists.forEach((p,i)=>{

const div=document.createElement("div");
div.className="widget";

div.innerHTML=`

<img src="${p.image}">
<div class="widgetTitle">${p.title}</div>

`;

div.onclick=()=>openPlaylist(i);

widgetContainer.appendChild(div);

});

/* PLAYLIST */

const playlistView=document.getElementById("playlistView");

let currentPlaylist=[];
let currentIndex=0;
let audio=new Audio();

function openPlaylist(i){

playlistView.innerHTML="";
playlistView.style.display="block";

currentPlaylist=playlists[i].tracks;

currentPlaylist.forEach((t,index)=>{

const div=document.createElement("div");
div.className="track";

div.innerHTML=`

<img src="${t.thumbnail}">
<div>
<div>${t.title}</div>
<div>${t.artist}</div>
</div>

`;

div.onclick=()=>playSong(index);

playlistView.appendChild(div);

});

}

/* PLAYER */

function playSong(i){

currentIndex=i;
const track=currentPlaylist[i];

audio.src=track.file;
audio.play();

document.getElementById("playerInfo").textContent=
track.title+" - "+track.artist;

}

/* CONTROLS */

function togglePlay(){
if(audio.paused) audio.play();
else audio.pause();
}

function nextSong(){

if(shuffle){
currentIndex=Math.floor(Math.random()*currentPlaylist.length);
}else{
currentIndex=(currentIndex+1)%currentPlaylist.length;
}

playSong(currentIndex);

}

function prevSong(){

currentIndex--;
if(currentIndex<0) currentIndex=currentPlaylist.length-1;

playSong(currentIndex);

}

/* PROGRESS */

const progress=document.getElementById("progress");

audio.ontimeupdate=()=>{
progress.value=(audio.currentTime/audio.duration)*100;
};

progress.oninput=()=>{
audio.currentTime=(progress.value/100)*audio.duration;
};

/* LOOP & SHUFFLE */

let shuffle=false;
let loop=false;

function toggleShuffle(){
shuffle=!shuffle;
}

function toggleLoop(){
loop=!loop;
audio.loop=loop;
}

/* MUSIC MODE */

const musicUI=document.getElementById("musicUI");

document.getElementById("musicBtn").onclick=()=>{

musicUI.style.display="flex";

};

function closeMusic(){

musicUI.style.display="none";
playlistView.style.display="none";

}

</script>

</body>
</html>

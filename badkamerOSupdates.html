<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BadkamerOS Music</title>

<style>

body{
font-family: Arial;
background:#0f0f0f;
color:white;
margin:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

#main{
width:420px;
background:#1c1c1c;
border-radius:12px;
padding:20px;
text-align:center;
box-shadow:0 0 20px rgba(0,0,0,0.6);
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
background:#2b2b2b;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#3b3b3b;
}

.frame{
display:none;
margin-top:15px;
}

iframe{
width:100%;
height:80px;
border:none;
}

audio{
width:100%;
margin-top:10px;
}

</style>
</head>

<body>

<div id="main">

<h2>BadkamerOS Music</h2>

<button onclick="openLocal()">Local muziek</button>
<button onclick="openSpotifyChoice()">Spotify</button>

<div id="localFrame" class="frame">

<input type="file" accept="audio/*" onchange="loadLocal(event)">
<audio id="audioPlayer" controls></audio>

</div>

<div id="spotifyChoice" class="frame">

<button onclick="loginSpotify()">Login met eigen account</button>
<button onclick="openDefaultSpotify()">Standaard Spotify</button>

</div>

<div id="spotifyFrame" class="frame">

<iframe id="spotifyPlayer"
src="https://open.spotify.com/embed/playlist/37i9dQZF1DXcBWIGoYBM5M">
</iframe>

<button onclick="hideSpotify()">Sluit Spotify frame</button>

</div>

</div>

<script>

const CLIENT_ID = "160369b6b21b47d8b8fa9da5590888f1";
const REDIRECT_URI = "https://joey226611.github.io/BadKamerSpiegelSite/badkamerOSupdates.html";
const SCOPES = "streaming user-read-email user-read-private";

function hideAll(){
document.getElementById("localFrame").style.display="none";
document.getElementById("spotifyChoice").style.display="none";
document.getElementById("spotifyFrame").style.display="none";
}

function openLocal(){
hideAll();
document.getElementById("localFrame").style.display="block";
}

function openSpotifyChoice(){
hideAll();
document.getElementById("spotifyChoice").style.display="block";
}

function openDefaultSpotify(){
hideAll();
document.getElementById("spotifyFrame").style.display="block";
}

function hideSpotify(){
document.getElementById("spotifyFrame").style.display="none";
}

function loadLocal(event){
const file = event.target.files[0];
const audio = document.getElementById("audioPlayer");
audio.src = URL.createObjectURL(file);
audio.play();
}

function generateRandomString(length){
const possible="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
let text="";
for(let i=0;i<length;i++){
text+=possible.charAt(Math.floor(Math.random()*possible.length));
}
return text;
}

async function sha256(plain){
const encoder=new TextEncoder();
const data=encoder.encode(plain);
return window.crypto.subtle.digest("SHA-256",data);
}

function base64encode(input){
return btoa(String.fromCharCode(...new Uint8Array(input)))
.replace(/=/g,"")
.replace(/\+/g,"-")
.replace(/\//g,"_");
}

async function loginSpotify(){

const codeVerifier=generateRandomString(64);
const hashed=await sha256(codeVerifier);
const codeChallenge=base64encode(hashed);

localStorage.setItem("spotify_code_verifier",codeVerifier);

const authUrl=new URL("https://accounts.spotify.com/authorize");

authUrl.search=new URLSearchParams({
client_id:CLIENT_ID,
response_type:"code",
redirect_uri:REDIRECT_URI,
scope:SCOPES,
code_challenge_method:"S256",
code_challenge:codeChallenge
}).toString();

window.location.href=authUrl.toString();

}

</script>

</body>
</html>

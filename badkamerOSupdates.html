<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BadkamerOS</title>

<style>

body{
background:#0f0f0f;
color:white;
font-family:Arial;

display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

#app{
width:420px;

}

button{
width:100%;

}

button:hover{
background:#333;
}

.frame{
display:none;
margin-top:15px;
}

iframe{
width:100%;

}

</style>
</head>

<body>

<div id="app">

<h2>Music</h2>

<button onclick="openSpotifyMenu()">Spotify</button>

<div id="spotifyMenu" class="frame">

<button onclick="loginSpotify()">Inloggen met eigen account</button>

<button onclick="openDefaultSpotify()">Standaard Spotify</button>

</div>

<div id="spotifyPlayer" class="frame">

<p>Spotify verbonden ✔</p>

<iframe
src="https://open.spotify.com/embed/playlist/37i9dQZF1DXcBWIGoYBM5M"
allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
loading="lazy">
</iframe>

</div>

</div>

<script>

const CLIENT_ID="...";

const REDIRECT_URI=
"https://joey226611.github.io/BadKamerSpiegelSite/badkamerOSupdates.html";

function hideAll(){
document.querySelectorAll(".frame").forEach(f=>{
f.style.display="none";
});
}

function openSpotifyMenu(){
hideAll();
document.getElementById("spotifyMenu").style.display="block";
}

function openDefaultSpotify(){
hideAll();
document.getElementById("spotifyPlayer").style.display="block";
}

function loginSpotify(){

const scopes="streaming user-read-email user-read-private";

const url=
"https://accounts.spotify.com/authorize"+
"?client_id="+CLIENT_ID+
"&response_type=code"+
"&redirect_uri="+encodeURIComponent(REDIRECT_URI)+
"&scope="+encodeURIComponent(scopes);

window.location=url;

}

function checkLogin(){

const params=new URLSearchParams(window.location.search);

const code=params.get("code");

if(code){

localStorage.setItem("spotify_code",code);

history.replaceState({},document.title,window.location.pathname);

}

if(localStorage.getItem("spotify_code")){

openDefaultSpotify();

}

}

checkLogin();

</script>

</body>
</html>

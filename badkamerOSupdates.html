<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BadkamerOS Music</title>

<style>

body{
background:#0f0f0f;
color:white;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

#app{
width:420px;
background:#1e1e1e;
padding:20px;
border-radius:12px;
text-align:center;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
background:#2a2a2a;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#3a3a3a;
}

.frame{
display:none;
margin-top:15px;
}

audio{
width:100%;
}

iframe{
width:100%;
height:80px;
border:none;
}

</style>

</head>

<body>

<div id="app">

<h2>Music</h2>

<button onclick="openLocal()">Local Music</button>
<button onclick="openSpotifyMenu()">Spotify</button>

<div id="localFrame" class="frame">
<input type="file" accept="audio/*" onchange="loadLocal(event)">
<audio id="audio" controls></audio>
</div>

<div id="spotifyMenu" class="frame">
<button onclick="loginSpotify()">Login met eigen account</button>
<button onclick="openDefaultSpotify()">Standaard Spotify</button>
</div>

<div id="spotifyPlayer" class="frame">

<p id="deviceStatus">Spotify player laden...</p>

<button onclick="playTest()">Test muziek</button>

</div>

<div id="spotifyEmbed" class="frame">

<iframe
src="https://open.spotify.com/embed/playlist/37i9dQZF1DXcBWIGoYBM5M">
</iframe>

</div>

</div>

<script src="https://sdk.scdn.co/spotify-player.js"></script>

<script>

const CLIENT_ID="VUL_JE_CLIENT_ID_HIER";
const REDIRECT_URI=window.location.origin+window.location.pathname;

let accessToken=null;

function hideAll(){

document.querySelectorAll(".frame").forEach(f=>{
f.style.display="none";
})

}

function openLocal(){

hideAll();
localFrame.style.display="block";

}

function openSpotifyMenu(){

hideAll();
spotifyMenu.style.display="block";

}

function openDefaultSpotify(){

hideAll();
spotifyEmbed.style.display="block";

}

function loadLocal(event){

const file=event.target.files[0];
const audio=document.getElementById("audio");

audio.src=URL.createObjectURL(file);
audio.play();

}

function loginSpotify(){

const scopes="streaming user-read-email user-read-private";

const authURL=
"https://accounts.spotify.com/authorize"+
"?client_id="+CLIENT_ID+
"&response_type=token"+
"&redirect_uri="+encodeURIComponent(REDIRECT_URI)+
"&scope="+encodeURIComponent(scopes);

window.location=authURL;

}

function getTokenFromURL(){

const hash=window.location.hash;

if(hash){

const params=new URLSearchParams(hash.replace("#",""));
accessToken=params.get("access_token");

}

}

window.onSpotifyWebPlaybackSDKReady=()=>{

getTokenFromURL();

if(!accessToken) return;

hideAll();
spotifyPlayer.style.display="block";

const player=new Spotify.Player({
name:"BadkamerOS Player",
getOAuthToken:cb=>{cb(accessToken)},
volume:0.5
});

player.addListener("ready",data=>{

deviceStatus.innerText="Verbonden met Spotify 🎵";

});

player.connect();

window.spotifyPlayer=player;

};

function playTest(){

fetch("https://api.spotify.com/v1/me/player/play",{
method:"PUT",
headers:{
Authorization:"Bearer "+accessToken
},
body:JSON.stringify({
uris:["spotify:track:11dFghVXANMlKmJXsNCbNl"]
})
})

}

</script>

</body>
</html>
